<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List Demo · DevOps CI/CD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#f2f5f7; --panel:#fff; --ink:#16202a; --muted:#5b6b79; --line:#d5dde3; --accent:#2457f5; --ok:#1a8a57; --bad:#b3261e; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:1.0625rem; line-height:1.6; }
      .wrap { max-width:640px; margin:0 auto; padding:2rem 1.25rem 3rem; }
      a { color:var(--accent); text-underline-offset:3px; }
      a:focus-visible, button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
      h1 { font-size:clamp(2rem,6vw,2.8rem); line-height:1.1; letter-spacing:-.03em; font-weight:800; margin:1.5rem 0 .5rem; }
      .sub { color:var(--muted); margin:0 0 1.5rem; }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1.25rem; }
      form { display:flex; gap:.5rem; }
      input[type=text] { flex:1; font:inherit; padding:.65rem .8rem; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
      button { font:inherit; cursor:pointer; }
      .add { background:var(--accent); color:#fff; border:2px solid var(--accent); border-radius:8px; padding:.6rem 1.1rem; font-weight:600; }
      .add:hover { background:#1a43c9; border-color:#1a43c9; }
      #msg { min-height:1.4rem; margin:.5rem 0 0; font-size:.92rem; color:var(--bad); }
      ul { list-style:none; margin:1rem 0 0; padding:0; }
      li { display:flex; align-items:center; gap:.75rem; padding:.65rem 0; border-top:1px solid var(--line); }
      li label { flex:1; cursor:pointer; overflow-wrap:anywhere; }
      li input { width:1.15rem; height:1.15rem; accent-color:var(--ok); }
      li.done label { color:var(--muted); text-decoration:line-through; }
      .del { background:none; border:1px solid var(--line); border-radius:6px; color:var(--muted); padding:.15rem .6rem; font-size:.88rem; }
      .del:hover { color:var(--bad); border-color:var(--bad); }
      .empty { color:var(--muted); padding:.65rem 0 0; margin:0; }
      .bar { display:flex; justify-content:space-between; align-items:center; margin-top:1rem; padding-top:.9rem; border-top:1px solid var(--line); color:var(--muted); font-size:.92rem; }
      .clear { background:none; border:0; color:var(--accent); text-decoration:underline; padding:0; }
      footer { margin-top:2rem; color:var(--muted); font-size:.9rem; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
      footer p { margin:0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a href="./index.html">Back to main site</a>
      <h1>Task list demo</h1>
      <p class="sub">A small working app to show your pipeline deployed something real. Add, complete and delete tasks. They are saved in your browser.</p>

      <div class="card">
        <form id="form">
          <input id="text" type="text" placeholder="Add a task" aria-label="New task" maxlength="100" autocomplete="off" />
          <button class="add" type="submit">Add task</button>
        </form>
        <p id="msg" role="alert"></p>
        <ul id="list"></ul>
        <p id="empty" class="empty">No tasks yet. Add your first one above.</p>
        <div class="bar">
          <span id="count">0 of 0 done</span>
          <button id="clear" class="clear" type="button">Clear completed</button>
        </div>
      </div>

      <footer>
        <p id="stamp"></p>
        <p><a href="./test.html">Open the pipeline test page</a></p>
      </footer>
    </div>

    <script>
      var KEY = 'devops_demo_tasks';
      var tasks = [];
      try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }

      var form = document.getElementById('form');
      var input = document.getElementById('text');
      var msg = document.getElementById('msg');
      var list = document.getElementById('list');
      var empty = document.getElementById('empty');
      var count = document.getElementById('count');

      function save() { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} }

      function render() {
        list.innerHTML = '';
        tasks.forEach(function (t) {
          var li = document.createElement('li');
          if (t.done) li.className = 'done';
          var box = document.createElement('input');
          box.type = 'checkbox'; box.checked = t.done; box.id = 't' + t.id;
          box.addEventListener('change', function () { t.done = box.checked; save(); render(); });
          var label = document.createElement('label');
          label.htmlFor = box.id; label.textContent = t.title;
          var del = document.createElement('button');
          del.className = 'del'; del.type = 'button'; del.textContent = 'Delete';
          del.setAttribute('aria-label', 'Delete task: ' + t.title);
          del.addEventListener('click', function () {
            tasks = tasks.filter(function (x) { return x.id !== t.id; }); save(); render();
          });
          li.append(box, label, del);
          list.appendChild(li);
        });
        var done = tasks.filter(function (t) { return t.done; }).length;
        count.textContent = done + ' of ' + tasks.length + ' done';
        empty.hidden = tasks.length > 0;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var title = input.value.trim();
        if (!title) { msg.textContent = 'Type a task before adding it.'; input.focus(); return; }
        msg.textContent = '';
        tasks.push({ id: Date.now(), title: title, done: false });
        input.value = '';
        save(); render(); input.focus();
      });

      document.getElementById('clear').addEventListener('click', function () {
        tasks = tasks.filter(function (t) { return !t.done; }); save(); render();
      });

      document.getElementById('stamp').textContent =
        'Loaded ' + new Date().toLocaleString() + ' from ' + (location.host || 'local');
      render();
    </script>
  </body>
</html>
